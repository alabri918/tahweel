:root{
  --bg:#0f5c55; --deep:#0a4641; --key:#1b736b; --tile:#fff; --edge:#c3d6d2; --ink:#0b2f2c;
  --hot:#ff8a5c; --hot-edge:#cf5f35; --line:rgba(255,255,255,.5);
  --side:230px; --t:60px; --gap:7px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:#fff;font-family:"Kufi",Tahoma,sans-serif;font-weight:700;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
#app{height:100vh;height:100dvh;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
h1{margin:0;flex:none;text-align:center;font-size:clamp(19px,5.4vw,32px);line-height:1.5;padding:10px 4px 12px}
h1 b{color:var(--hot);white-space:nowrap}
#mid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--side);gap:10px}
#side{min-height:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:7px;padding-bottom:10px}
.num{display:flex;align-items:center;justify-content:space-between;background:var(--deep);border-radius:10px;padding:8px 12px;font-size:22px;font-variant-numeric:tabular-nums;direction:ltr;flex:none}
#time::after{content:"الوقت"}#count::after{content:"الكلمات"}
.num::after{font-size:13px;opacity:.75}
#teams{display:flex;flex-direction:column;gap:6px;margin-top:6px;flex:none}
.team{position:relative;background:var(--key);border-radius:10px;padding:7px 10px;border:2px solid transparent;text-align:right}
.team.on{border-color:var(--hot);background:var(--deep)}
.who{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:16px}.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.off{opacity:.45}
.x{width:26px;height:26px;border-radius:7px;background:none;font-size:18px;line-height:1;opacity:.7;flex:none}
.res{display:flex;justify-content:space-between;gap:6px;font-size:14px;line-height:1.7;font-variant-numeric:tabular-nums}
.sum{border-top:1px solid var(--line);margin-top:3px;font-size:17px;color:var(--hot)}
#side>button{flex:none;height:42px;border-radius:10px;background:var(--key);font-size:16px}
#side>#skip{margin-top:auto}
#list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;display:flex;flex-direction:column;padding:6px 0 10px}
#list::-webkit-scrollbar{display:none}
#rows{display:flex;flex-direction:column;gap:var(--gap)}
.row{display:flex;justify-content:center;gap:var(--gap);flex:none}
.c{width:var(--t);height:var(--t);border-radius:9px;display:grid;place-items:center;font-size:calc(var(--t)*.5);line-height:1;
  background:var(--tile);color:var(--ink);box-shadow:inset 0 -4px 0 var(--edge);padding-bottom:4px}
.c.ch{background:var(--hot);box-shadow:inset 0 -4px 0 var(--hot-edge)}
#input .c{background:transparent;box-shadow:inset 0 0 0 2px var(--line);color:#fff}
#input .c.cur{box-shadow:inset 0 0 0 3px #fff}
.in .c{animation:pop .22s cubic-bezier(.2,.8,.3,1) both}
.in .c:nth-child(2){animation-delay:.03s}.in .c:nth-child(3){animation-delay:.06s}.in .c:nth-child(4){animation-delay:.09s}.in .c:nth-child(5){animation-delay:.12s}
@keyframes pop{from{transform:scale(.82);opacity:.2}}
.bad{animation:shake .36s}
#input.bad .c{box-shadow:inset 0 0 0 3px var(--hot);color:var(--hot)}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
#kb{flex:none;display:flex;flex-direction:column;gap:6px}
.kr{display:flex;gap:4px;direction:ltr}
.k{flex:1 1 0;min-width:0;height:46px;border-radius:7px;background:var(--key);font-size:20px;touch-action:manipulation}
.k:active{background:var(--deep)}
.k svg{width:25px;height:25px;display:block;margin:auto}
.k.ok{background:var(--hot);color:var(--ink);flex:2 1 0}
#lobby,#join,#app,#cup{display:none!important}
[data-view=lobby] #lobby,[data-view=join] #join{display:flex!important}[data-view=game] #app,[data-view=cup] #cup{display:flex!important}
#lobby,#join{height:100vh;height:100dvh;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}
#qr,#qr2{background:#fff;border-radius:16px;padding:12px}#qr{width:min(74vw,46vh)}#qr svg,#qr2 svg{display:block;width:100%;height:auto}
#code{font-size:46px;line-height:1.2;letter-spacing:.14em;direction:ltr}
#names{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:760px;min-height:42px}
.nmc{background:var(--deep);border-radius:10px;padding:8px 16px;font-size:18px}
#start,#go,#join button{background:var(--hot);color:var(--ink);border-radius:12px;font-size:22px;height:60px;box-shadow:inset 0 -4px 0 var(--hot-edge)}
#start{width:min(320px,80vw)}#start:disabled{opacity:.35;cursor:default}#go{flex:none;margin:6px 0}
#join input{width:min(320px,86vw);height:56px;border-radius:12px;border:2px solid var(--line);background:var(--deep);color:#fff;font:inherit;font-size:21px;text-align:center;outline:0;user-select:text;-webkit-user-select:text}
#join input:focus{border-color:#fff}#join input.bad{border-color:var(--hot)}#join input::placeholder{color:#fff;opacity:.4}#join button{width:min(320px,86vw)}
#jcode{letter-spacing:.2em}
#mode{display:flex;background:var(--deep);border-radius:12px;padding:4px;width:min(320px,80vw)}#mode button{flex:1;height:44px;border-radius:9px;background:none;font-size:18px}#mode .on{background:#fff;color:var(--ink)}.player #mode{display:none}
#cup{height:100vh;height:100dvh;flex-direction:column;align-items:center;padding:max(6px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
#brw{flex:1;min-height:0;width:100%;display:grid;place-items:center;container-type:size}
#br{position:relative;width:min(100cqw,100cqh*var(--ar));container-type:inline-size;direction:ltr}
#br svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;border-radius:9px;background:#fff;color:var(--ink);box-shadow:inset 0 -4px 0 var(--edge);padding:0 6px 3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;direction:rtl;line-height:1.2}
.slot.empty,.slot.champ{background:var(--deep);box-shadow:inset 0 0 0 2px var(--line)}
.slot.lost{background:#7fa5a0;box-shadow:none;color:#123a36;text-decoration:line-through}
.slot.won,.slot.champ.won{background:var(--hot);color:var(--ink);box-shadow:inset 0 -4px 0 var(--hot-edge)}
.slot.live{outline:4px solid var(--hot)}
[data-phase=champion] #cuph{font-size:clamp(34px,9vw,64px)}
#cupb{flex:none;display:flex;gap:10px;margin-top:8px}#cupb button{height:56px;border-radius:12px;font-size:20px;padding:0 30px;background:var(--deep)}#cupb #cupgo{background:var(--hot);color:var(--ink);box-shadow:inset 0 -4px 0 var(--hot-edge);min-width:200px}
.who .sc{font-size:26px;line-height:1.1}.res.win{color:var(--hot)}
.addf{display:flex;gap:6px;flex:none;width:min(320px,80vw)}#side .addf{width:100%}.player .addf,[data-mode=cup] #side .addf{display:none}
.addf input{flex:1;min-width:0;height:48px;border-radius:10px;border:2px solid var(--line);background:var(--deep);color:#fff;font:inherit;font-size:18px;text-align:center;outline:0;user-select:text;-webkit-user-select:text}
.addf input:focus{border-color:#fff}.addf input.bad{border-color:var(--hot)}
.addf button{width:52px;flex:none;border-radius:10px;background:#fff;color:var(--ink);font-size:26px;line-height:1}
#side .addf input{height:38px;font-size:16px}#side .addf button{width:38px;font-size:22px}
@media (max-width:640px){#side .addf button{width:30px}#side .addf input{padding:0 2px}}
@media (hover:hover) and (pointer:fine){#kb{display:none}}
@media (max-height:620px){#qr{width:34vh}#lobby{gap:9px}#code{font-size:30px}}
#qr2w{flex:none;text-align:center;font-size:20px;direction:ltr}#qr2{width:132px;margin:8px auto 2px;padding:7px;border-radius:10px}
.player #qr2w,.player #skip,.player #reset,.player #qr,.player #code,.player #start{display:none}
[data-phase=ready] #time,[data-phase=ready] #count{opacity:.5}
#spin{position:fixed;left:50%;top:14px;width:26px;height:26px;margin-left:-13px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--hot);animation:spin .9s linear infinite;display:none}
.wait #spin{display:block}@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:640px){#qr2w{display:none}}
@media (max-width:640px){:root{--side:104px;--t:min(46px,calc((100vw - 104px - 26px - 4*5px)/5));--gap:5px}#mid{gap:8px}
  .num{padding:6px 8px;font-size:17px}.num::after{font-size:11px}.team{padding:5px 7px}.res{font-size:12px}.sum{font-size:13px}.who{font-size:13px}#side{gap:5px}#side>button{height:38px;font-size:15px}}
@media (max-height:620px){.k{height:38px}h1{padding:5px 4px 7px;font-size:19px}}
@media (max-height:460px){:root{--t:36px;--gap:4px}.k{height:30px;font-size:16px}.kr{gap:3px}#kb{gap:3px}}
@media (prefers-reduced-motion:reduce){.in .c,.bad{animation:none}}
</style>
</head>

<section id="lobby">
  <div id="qr"></div>
  <div id="code"></div>
  <div id="names"></div>
  <form class="addf" autocomplete="off"><input maxlength="14" aria-label="الاسم"><button aria-label="إضافة">+</button></form>
  <div id="mode"><button id="mfree" type="button">حر</button><button id="mcup" type="button">دوري</button></div>
  <button id="start" type="button">ابدأ</button>
</section>
<section id="cup">
  <h1 id="cuph"></h1>
  <div id="brw"><div id="br"></div></div>
  <div id="cupb"><button id="cupgo" type="button">ابدأ</button><button id="cupno" type="button">إلغاء</button></div>
</section>
<form id="join" autocomplete="off">
  <input id="jcode" inputmode="numeric" maxlength="4" aria-label="الرمز" placeholder="0000">
  <input id="jname" maxlength="14" aria-label="الاسم" placeholder="الاسم">
  <button>دخول</button>
</form>
<div id="app">
  <h1 id="goal"></h1>
  <div id="mid">
    <main id="list" aria-live="polite"><div id="rows"></div></main>
    <aside id="side">
      <div class="num" id="time" role="timer" aria-label="الوقت">00:00</div>
      <div class="num" id="count" aria-label="الكلمات">0</div>
      <div id="teams"></div>
      <form class="addf" autocomplete="off"><input maxlength="14" aria-label="الاسم"><button aria-label="إضافة">+</button></form>
      <div id="qr2w"><div id="qr2"></div><div id="code2"></div></div>
      <button id="skip" type="button">التالي</button>
      <button id="reset" type="button">تصفير</button>
    </aside>
  </div>
  <button id="go" type="button" hidden>ابدأ</button>
  <div id="kb" hidden></div>
</div>
<div id="spin" aria-hidden="true"></div>

  if(!(m.a in m.play&&m.b in m.play)) return;
  m.closed=true;const x=m.play[m.a],y=m.play[m.b];
  const k=!x&&!y?-1:!y?0:!x?1:x[0]!==y[0]?(x[0]<y[0]?0:1):x[1]!==y[1]?(x[1]<y[1]?0:1):-1;
  if(k<0) return;
  const w=k?m.b:m.a;m.sc[k]++;m.log[w][m.log[w].length-1][2]=1;
  if(m.sc[k]>=MATCH_WINS) endMatch(w);
}
function cupNext(){
  clearTimeout(doneTimer);const m=S.match;if(!m) return;
  if(m.over) return toBracket();
  if(m.closed){m.no++;m.play={};m.closed=false;S.round++}
  cupReady();
}
function proceed(){if(S.match) cupNext();else advance(turnIndex())}
function skip(){
  if(!S.match) return advance(turnIndex());
  if(S.phase!=='done') record(S.turn,null);
  cupNext();
}

/* ---------- التلفون ---------- */
let P={code:'',name:'',peer:null,conn:null,retry:0,last:0,in:false};
function send(m){
  if(!PLAYER) return hostMsg({local:true,pid:myId,send(){}},m);
  try{P.conn&&P.conn.open&&P.conn.send(m)}catch(e){}}
function retry(){clearTimeout(P.retry);if(P.in) P.retry=setTimeout(link,2500)}
function link(){
  if(!P.in) return;
  if(typeof Peer==='undefined') return retry();
  if(!P.peer||P.peer.destroyed){
    P.peer=new Peer(undefined,PEER_CFG);
    P.peer.on('open',dial);
    P.peer.on('disconnected',()=>setTimeout(()=>{if(P.peer&&P.peer.disconnected&&!P.peer.destroyed) P.peer.reconnect()},1200));
    P.peer.on('error',e=>{if(e.type==='peer-unavailable'&&!V) badCode();retry()});
  }else if(P.peer.open) dial();
  else{if(P.peer.disconnected) P.peer.reconnect();retry()}
}
function badCode(){
  if(/^\d{4}$/.test(hash)) return;
  P.in=false;document.body.dataset.view='join';document.body.classList.remove('wait');shake($('jcode'));
}
function shake(e){e.classList.remove('bad');void e.offsetWidth;e.classList.add('bad')}
function dial(){
  if(!P.in) return;
  try{P.conn&&P.conn.close()}catch(e){}
  const c=P.peer.connect(PREFIX+P.code,{reliable:true});P.conn=c;
  c.on('open',()=>{if(c!==P.conn) return;P.last=Date.now();c.send({t:'join',pid:myId,name:P.name})});
  c.on('data',d=>{
    if(c!==P.conn||!d) return;P.last=Date.now();
    if(d.t==='out'){P.in=false;store.set('tahweel-code','');V=null;drawn='';document.body.dataset.view='join';document.body.classList.remove('wait');return}
    if(d.t==='state'){document.body.classList.remove('wait');render(d.v)}
  });
  const lost=()=>{if(c!==P.conn) return;if(P.in) document.body.classList.add('wait');retry()};
  c.on('close',lost);c.on('error',lost);
  setTimeout(()=>{if(c===P.conn&&!c.open) retry()},8000);
}
function player(){
  myId=store.get('tahweel-pid');
  if(!myId){myId=Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');store.set('tahweel-pid',myId)}
  document.body.classList.add('player');document.body.dataset.view='join';
  const fixed=/^\d{4}$/.test(hash);$('jcode').hidden=fixed;$('jname').value=store.get('tahweel-name')||'';
  $('join').addEventListener('submit',e=>{
    e.preventDefault();P.name=$('jname').value.trim();
    P.code=fixed?hash:$('jcode').value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();
    if(!/^\d{4}$/.test(P.code)) return shake($('jcode'));
    if(!P.name) return shake($('jname'));
    store.set('tahweel-name',P.name);store.set('tahweel-code',P.code);document.activeElement.blur();
    P.in=true;V=null;drawn='';document.body.classList.add('wait');link();
  });
  if(fixed&&store.get('tahweel-code')===hash&&$('jname').value) $('join').requestSubmit();
  setInterval(()=>{if(!P.in||!P.conn) return;send({t:'ping'});
    if(P.last&&Date.now()-P.last>11000){P.last=Date.now();document.body.classList.add('wait');link()}},4000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&P.in){if(P.conn&&P.conn.open) send({t:'join',pid:myId,name:P.name});else link()}});
}

/* ---------- الكتابة ---------- */
function live(bad){if(PLAYER) send({t:'type',b:buf.join(''),bad:!!bad,n:V.n,i:V.words.length})}
function reject(){live(true);input.classList.remove('bad');void input.offsetWidth;input.classList.add('bad');fresh=true}
function enter(){
  if(V&&V.phase==='ready'&&V.turn===myId) return send({t:'go'});
  if(!mine()||!input) return;
  const raw=buf.join(''), seq=[V.a,...V.words], last=norm(seq[seq.length-1]);
  if(!legal(norm(raw),last)) return reject();
  send({t:'word',w:raw,n:V.n,i:V.words.length});
}
function clean(){input.classList.remove('bad');const f=fresh;fresh=false;return f}
function letter(ch){
  if(!mine()||!input) return;
  if(clean()) buf=[];
  if(buf.length<norm(V.b).length) buf.push(ch);
  drawInput();bottom();live();
}
function back(){if(!mine()||!input) return;clean();buf.pop();drawInput();live()}

const KEYS=['ضصثقفغعهخحج','شسيبلاتنمكط','ذدءئؤرىةوزظ'];
const kb=$('kb');
const ICON={back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11v14H9l-6-7zM12 9.5l5 5M17 9.5l-5 5"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'};
function key(html,label,fn,cls){
  const b=document.createElement('button');b.type='button';b.className='k'+(cls||'');b.innerHTML=html;b.setAttribute('aria-label',label);
  b.addEventListener('click',fn);return b;
}
for(const r of KEYS){const d=document.createElement('div');d.className='kr';for(const ch of r) d.append(key(ch,ch,()=>letter(ch)));kb.append(d)}
{const d=document.createElement('div');d.className='kr';d.append(key(ICON.back,'حذف',back),key(ICON.ok,'إدخال',enter,' ok'));kb.append(d)}

// لوحة مفاتيح الكمبيوتر: عربية مباشرة، أو حسب موضع المفتاح إن كانت اللغة إنجليزية
const POS={KeyQ:'ض',KeyW:'ص',KeyE:'ث',KeyR:'ق',KeyT:'ف',KeyY:'غ',KeyU:'ع',KeyI:'ه',KeyO:'خ',KeyP:'ح',BracketLeft:'ج',BracketRight:'د',
KeyA:'ش',KeyS:'س',KeyD:'ي',KeyF:'ب',KeyG:'ل',KeyH:'ا',KeyJ:'ت',KeyK:'ن',KeyL:'م',Semicolon:'ك',Quote:'ط',
KeyZ:'ئ',KeyX:'ء',KeyC:'ؤ',KeyV:'ر',KeyN:'ى',KeyM:'ة',Comma:'و',Period:'ز',Slash:'ظ',Backquote:'ذ'};
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||/^(INPUT|BUTTON)$/.test(e.target.tagName||'')) return;
  if(e.key==='Enter'){if(e.repeat) return;e.preventDefault();return enter()}
  if(e.key==='Backspace'){e.preventDefault();return back()}
  if(/^[ء-غف-ي]$/.test(e.key)) return letter(e.key);
  if(e.key==='لا'){letter('ل');return letter('ا')}
  if(/^[\x21-\x7e]$/.test(e.key)&&POS[e.code]&&!e.shiftKey) return letter(POS[e.code]);
});
setInterval(()=>{if(V&&V.phase==='play') tick()},200);
PLAYER?player():host();
$('go').addEventListener('click',e=>{e.currentTarget.blur();send({t:'go'})});
addEventListener('hashchange',()=>location.reload());
</script>
